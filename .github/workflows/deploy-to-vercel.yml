name: Deploy to Vercel

on:
  workflow_run:
    workflows: ["Generate OSRS Tiles"]
    types:
      - completed
  push:
    branches: [main]
    paths-ignore:
      - 'public/tiles/**'  # Don't deploy on tile updates alone
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Only run if tile generation succeeded
    if: |
      github.event_name == 'push' || 
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        # Fetch latest changes including tiles
        ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build Next.js application
      run: npm run build
      env:
        NODE_OPTIONS: '--max-old-space-size=4096'

    # Option 1: Use Vercel CLI for deployment (more reliable)
    - name: Install Vercel CLI
      run: npm i -g vercel@latest
      if: env.VERCEL_TOKEN != ''
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    - name: Create lightweight deployment
      run: |
        echo "⚠️  Tiles are 864MB - too large for Vercel deployment"
        echo "🔄 Creating deployment without tiles (API will redirect to GitHub)"
        mkdir -p public/tiles-placeholder
        echo "Tiles served from GitHub repository" > public/tiles-placeholder/README.txt
        rm -rf public/tiles

    - name: Deploy to Vercel (Production)
      run: |
        echo "🚀 Deploying lightweight version..."
        vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
      if: github.ref == 'refs/heads/main' && env.VERCEL_TOKEN != ''
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    - name: Deploy to Vercel (Preview)
      id: deploy_preview
      run: |
        URL=$(vercel --token ${{ secrets.VERCEL_TOKEN }} | tail -1)
        echo "preview_url=$URL" >> "$GITHUB_OUTPUT"
        echo "Preview deployed: $URL"
      if: github.ref != 'refs/heads/main' && env.VERCEL_TOKEN != ''
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    - name: Comment preview URL on PR
      if: github.event_name == 'pull_request' && steps.deploy_preview.outputs.preview_url != ''
      env:
        GH_TOKEN: ${{ github.token }}
        URL: ${{ steps.deploy_preview.outputs.preview_url }}
        BRANCH: ${{ github.head_ref }}
        REPO: ${{ github.repository }}
      run: |
        PR_NUMBER=$(gh pr list -R "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number')
        if [ -z "$PR_NUMBER" ]; then
          echo "No open PR for branch '$BRANCH' — skipping comment."
          exit 0
        fi
        MARKER='<!-- vercel-preview-url -->'
        BODY="${MARKER}
        ## 🔍 Preview deployment
        Live preview: ${URL}
        _Re-deploys automatically on every commit to \`${BRANCH}\`. This comment updates in place._"
        COMMENT_ID=$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" \
          --jq ".[] | select(.user.login==\"github-actions[bot]\") | select(.body | startswith(\"$MARKER\")) | .id" | head -1)
        if [ -n "$COMMENT_ID" ]; then
          gh api -X PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="$BODY" >/dev/null
          echo "Updated existing preview comment on #$PR_NUMBER"
        else
          gh pr comment "$PR_NUMBER" -R "$REPO" --body "$BODY"
          echo "Posted preview comment on #$PR_NUMBER"
        fi

    # Option 2: Simple notification (if secrets not configured)
    - name: Deployment Ready Notification
      run: |
        echo "🎯 Application is ready for deployment!"
        echo "📦 Build completed successfully"
        echo "🗺️ Tiles are up to date"
        echo ""
        echo "To deploy manually:"
        echo "  vercel --prod"
        echo ""
        echo "Or configure Vercel secrets for automatic deployment:"
        echo "  VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID"
      if: env.VERCEL_TOKEN == ''
      env:
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
